# Terrain Diffusion MC configuration
# Terrain Diffusion MC 配置文件

# Inference device: "cpu", "gpu", or "auto" (try GPU first then fall back to CPU).
# 推理设备："cpu"、"gpu" 或 "auto"（优先尝试 GPU，失败后回退 CPU）。
# Ignored for the CPU build.
# CPU 构建会忽略此选项。
inference.device=gpu

# Offload inactive models from VRAM so only one model occupies the GPU at a time.
# 将非活动模型移出显存，使 GPU 同一时刻只驻留一个模型。
# Keeps peak VRAM to 1.5-2 GB. Set to false if you have ~2.5+ GB of free VRAM for
# slightly faster generation (avoids reloading sessions between pipeline stages).
# 可将峰值显存控制在 1.5-2 GB。若你有约 2.5 GB 以上空闲显存，可设为 false 以
# 获得略快的生成速度（避免在管线各阶段之间反复重载会话）。
inference.offload_models=true

# Fall back to CPU when inference.device=gpu but no GPU provider (CUDA/DirectML/CoreML)
# can be loaded. If false, the game/server refuses to start instead.
# 当 inference.device=gpu 但无法加载任何 GPU 提供器（CUDA/DirectML/CoreML）时回退到 CPU。
# 设为 false 则改为直接拒绝启动。
inference.fallback_cpu=true

# Validate SHA-256 for pre-existing files in .minecraft/terrain-diffusion-models.
# 对 .minecraft/terrain-diffusion-models 中已有的文件做 SHA-256 校验。
# Set to false to allow custom user-provided models/config without hash checks.
# 若想使用自备的模型/配置文件并跳过哈希校验，请设为 false。
validate_model=true

# Skip the 26.x server startup preload of a large spawn area around the world origin.
# 跳过 26.x 服务器启动时围绕世界原点的大范围出生点区域预生成。
# That preload generates tens of thousands of diffusion tiles (each ~6 s on a mid-range
# GPU) before the server becomes joinable. Skipping it makes the server ready in about
# a minute; the join-time spawn area is only 7x7 chunks and the rest generates on demand
# as players explore.
# 该预生成会在服务器可连接前生成数万块扩散地形（中端 GPU 每块约 6 秒）。跳过它可让
# 服务器约 1 分钟就绪；进服时的出生点区域仅 7x7 区块，其余地形随玩家探索按需生成。
worldgen.skip_initial_chunk_preload=true

# Port for the local terrain explorer web UI (started with /td-explore command).
# 本地地形探索器网页界面的端口（通过 /td-explore 命令启动）。
explorer.port=19801

# Terrain generation region side length in blocks. Must be a power of 2.
# 地形生成区域的边长（方块数）。必须是 2 的幂。
# Examples: 128, 256, 512, 1024.
# 例如：128、256、512、1024。
# Use larger values to generate in larger batches (more chunks per second)
# 使用更大的值可成批生成更多区块（每秒生成的区块更多）
# Use smaller values to generate in smaller batches (most responsive)
# 使用更小的值可小批量生成（响应更及时）
tile_size=256

# DPM-Solver++ step count for the coarse elevation stage (the dominant cost of worldgen).
# 粗粒度高程阶段的 DPM-Solver++ 步数（地形生成的主要开销）。
# 20 matches the reference pipeline and keeps terrain fidelity; lowering it (e.g. 12-16)
# generates faster at a slight fidelity cost. Clamped to [8, 32].
# 20 与参考管线一致，地形保真度最佳；降低（如 12-16）生成更快但保真度略有下降。
# 取值范围 [8, 32]。
pipeline.coarse_steps=20

# Spawn search: coarse-pixel region sizes for land detection near (0,0).
# 出生点搜索：在 (0,0) 附近检测陆地的粗像素区域大小。
# Starts at initial_size x initial_size, expands by 8 each iteration up to max_size x max_size.
# 从 initial_size x initial_size 开始，每轮扩大 8，直至 max_size x max_size。
spawn_search.initial_size=16
spawn_search.max_size=128

# Model download sources (Hugging Face hosts), tried in order until one succeeds.
# 模型下载源（Hugging Face 主机），按顺序尝试直到成功。
# If the official host fails, mirrors are used automatically (e.g. hf-mirror.com for CN users).
# 官方源失败时自动切换镜像源（如国内常用的 hf-mirror.com）。
# Comma-separated; the first host is tried first.
# 逗号分隔，排在前面的优先尝试。
download.mirrors=huggingface.co,hf-mirror.com

# Minimum download speed in KB/s. If a source stays below this for 30 seconds,
# it is abandoned and the next mirror is tried automatically.
# 最低下载速度（KB/s）。若某源持续 30 秒低于此速度，将自动放弃并切换到下一个镜像源。
# 0 disables the speed check.
# 设为 0 可禁用速度检测。
download.min_speed_kbps=100

# PyPI hosts for the automatic CUDA 12 runtime library download, tried in order.
# Used on Linux servers missing libcublasLt.so.12 etc.: the ONNX Runtime Java GPU
# package always links CUDA 12 libraries, so the mod fetches and preloads them
# automatically on first run (about 1.5 GiB, cached under the model directory).
# Resolved via each mirror's PEP 503 simple index; mirrors are verified to serve the
# required cudart >= 12.9 wheel (older mirror caches without it are skipped).
# 自动下载 CUDA 12 运行库所用的 PyPI 主机列表，按顺序尝试。
# 用于缺少 libcublasLt.so.12 等库的 Linux 服务器：ONNX Runtime 的 Java GPU 包始终
# 链接 CUDA 12 库，模组会在首次运行时自动下载并预加载（约 1.5 GiB，缓存于模型目录下）。
# 通过各镜像的 PEP 503 simple 索引解析；已实测镜像均提供所需的 cudart >= 12.9 包
# （缓存过旧、不满足版本的镜像会被自动跳过）。
# Comma-separated; the first host is tried first.
# 逗号分隔，排在前面的优先尝试。
download.cuda_mirrors=pypi.org,pypi.tuna.tsinghua.edu.cn,mirrors.aliyun.com,mirrors.cloud.tencent.com,repo.huaweicloud.com,mirrors.ustc.edu.cn,mirrors.bfsu.edu.cn

# Rivers: carve winding river channels into the terrain. This is an integration-layer
# overlay applied after the diffusion model and is deterministic for a given world seed.
# 河流：在地形中雕刻蜿蜒的河道。这是在扩散模型之后施加的集成层覆盖，
# 对给定的世界种子是确定性的。
# Channels dip just below sea level so they hold water. Raise rivers.flow_threshold for
# fewer, larger rivers; lower rivers.depth for shallower channels that claim less land.
# 河道会雕刻至海平面以下以蓄水。调高 rivers.flow_threshold 可获得更少更大的河流；
# 调低 rivers.depth 可获得更浅、占用陆地更少的河道。
rivers.enabled=true

# River mode: "hybrid" (default) follows the real terrain - D8 flow-accumulation paths
# are computed on the elevation (with a halo window so they are seamless across tiles)
# and carved below sea level so channels actually hold water.
# "carver" uses the pure noise zero-contour carver instead.
# 河流模式："hybrid"（默认）沿真实地形 - 在高程上计算 D8 汇流路径
# （带 halo 扩展窗口保证跨 tile 无缝），并雕刻至海平面以下真实蓄水。
# "carver" 则使用纯噪声零等高线雕刻方案。
rivers.mode=hybrid

# Minimum D8 contributing area (in native pixels) for a river path. Lower = more streams.
# D8 河流路径的最小汇流面积（原生像素单位）。值越小支流越多。
rivers.flow_threshold=50

# Dilation rings added to a carved path for tapered banks (0 = centre-line only).
# 雕刻河道时附加的河岸膨胀环数（0 = 只挖中心线）。
rivers.carve_width=1

# River-network noise frequency (per metre). Lower values space rivers further apart.
# Used by "carver" mode only.
# 河流网络噪声频率（每米）。值越小，河流间距越大。仅 "carver" 模式使用。
rivers.frequency=0.00035

# Half-width of a river channel in noise units. Larger values make wider rivers.
# Used by "carver" mode only.
# 河道半宽（噪声单位）。值越大，河流越宽。仅 "carver" 模式使用。
rivers.width=0.045

# Depth in metres (below sea level) cut at a river's centre-line. The mod compresses
# below-sea-level depth, so ~16 m gives a channel a few blocks deep.
# 河道中心线处（海平面以下）的深度（米）。模组会压缩海平面以下深度，
# 约 16 米可形成几格深的河道。
rivers.depth=16

# Rivers are only carved into terrain below this elevation (metres). Channels reach below
# sea level so they hold water; this cap keeps them as valleys rather than deep canyons.
# 仅在此海拔（米）以下的地形中雕刻河流。河道低于海平面以蓄水；
# 该上限保证河流呈河谷形态而非深峡谷。
rivers.max_altitude=40

# Terrain shaping: folded-ridge noise gives mountains a skeletal spine.
# 地形塑造：折叠脊线噪声给山脉添加骨架感。
# Uses abs(noise) weighted by elevation. Amplitude increases with altitude.
# 使用 abs(noise) 并按海拔加权，高处更强。
terrain.ridges.enabled=true

# Ridge noise amplitude (metres at native resolution, 1 native pixel = ~90 m).
# 脊线噪声振幅（原生分辨率下的米数，1 原生像素 ≈ 90 m）。
terrain.ridges.amplitude=80

# Terrain shaping: plateau-step spline mapping.
# 地形塑造：高原台地 spline 映射。
# Compresses elevation within [min, max] into a flatter band and steepens the
# region above it, creating mesa/plateau-like vertical breaks.
# 将 [min, max] 区间的海拔压缩为平顶带、区间以上做陡升，形成台地/高原断层。
terrain.plateau.enabled=true

# Plateau band lower bound (metres).
# 高原带下界（米）。
terrain.plateau.min=600

# Plateau band upper bound (metres).
# 高原带上界（米）。
terrain.plateau.max=1800

# Compression inside the plateau band (0 = perfectly flat top, 1 = no change).
# 高原带内压缩率（0 = 完全平顶，1 = 不变）。
terrain.plateau.compression=0.3

# Cliff steepness multiplier above the plateau band (>1 = steeper cliffs).
# 高原带上方悬崖陡度乘子（>1 = 更陡峭）。
terrain.plateau.cliff_steepness=2.5

# Low-freq noise shift range (metres) for the plateau band so plateaus are
# regional rather than global. 0 disables regional variation.
# 低频噪声对高原带上下界偏移的幅度（米），使台地局部化而非全局化。0 = 禁用。
terrain.plateau.variability=400

# Wonders: rare spectacular landforms (spires, calderas, mesas, pillars, gorges).
# 奇观：稀缺壮观地形（尖塔、火山口、平顶山、石柱群、峡谷）。
# Placed via biome-conditional gating + low-freq noise density control.
# 通过生物群系条件门控 + 低频噪声密度控制放置。
wonders.enabled=true

# Conditional generation: replace the synthetic elevation prior with an imported
# grayscale heightmap PNG (Azgaar export, GeoTIFF must be converted to 16-bit PNG first).
# The heightmap tiles the whole world; temperature/precipitation channels stay synthetic.
# 条件化生成：用导入的灰度高度图 PNG（Azgaar 导出；GeoTIFF 需先转为 16 位 PNG）替换合成高程先验。
# 高度图在整个世界平铺重复；温度/降水等通道仍为合成噪声。
conditional.enabled=false

# Path to the heightmap PNG. Empty disables the feature regardless of enabled.
# 高度图 PNG 的路径。留空则无论 enabled 如何都禁用。
conditional.heightmap_path=

# Elevation (metres) mapped to the heightmap's darkest / brightest pixel.
# 高度图最暗 / 最亮像素对应的海拔（米）。
conditional.heightmap_min=-100
conditional.heightmap_max=4000

# Biome climate noise: multiplier for fine-scale temperature/snow per-pixel jitter
# inside BiomeClassifier. Lower values reduce biome fragmentation (settable at
# runtime for A/B comparison in the explorer).
# 生物群系气候噪声：BiomeClassifier 中精细温度/雪线逐像素抖动的乘子。
# 降低此值可减少生物群系碎片化（支持运行时在 explorer 中做 A/B 对比）。
biome.noise_strength=1.0

# Biome smoothing: majority-filter isolated single-pixel speckles in the
# classified biome grid (3x3 neighbourhood, >=5 of 8 votes). Oceans, coastlines
# and carved rivers are never smoothed, so shores and channels stay crisp.
# 生物群系平滑：对分类后的生物群系网格做孤立单像素斑点多数滤波（3x3 邻域，8 邻域中 ≥5 票）。
# 海洋、海岸线与雕刻河道永不参与平滑，岸线与河道保持锐利。
biome.smoothing_enabled=true
